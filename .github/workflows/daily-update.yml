name: Taegliches Update (Marktwert, Punkte, News)

# Laeuft jeden Tag um ca. 8:00 Uhr deutscher Zeit (6:00 UTC - waehrend
# der Winterzeit entspricht das dann 7:00 Uhr deutscher Zeit, das ist
# bewusst in Kauf genommen, um die Automatisierung einfach zu halten).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Kader aller Vereine abrufen (Marktwert, Punkte, Trend)
        run: python scraper/fetch_squad.py

      - name: Ligainsider-News aller Vereine abrufen
        run: python scraper/fetch_ligainsider_news.py

      - name: Marktwert-Scoring neu berechnen
        run: |
          python scoring/market_value_ratio.py
          python scoring/market_value_trend.py

      - name: Spieler-Uebersicht neu bauen
        run: python scoring/build_player_overview.py

      - name: Marktwert-Historie fuer Spieleranalyse aktualisieren
        run: python scoring/build_marktwert_history.py

      - name: Daten committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data website/data
          git diff --cached --quiet || git commit -m "Taegliches Update: Marktwert, Punkte, News"

          # Falls in der Zwischenzeit (z.B. durch einen manuellen Push)
          # bereits neue Commits auf origin/main liegen: mergen statt
          # einfach zu pushen. Ein Konflikt kann praktisch nur bei den
          # generierten JSON-Dateien auftreten (data/*.csv sind immer
          # eindeutig datierte, nicht ueberschneidende Dateien) - die
          # werden dann statt manuell aufgeloest einfach aus den
          # bereits gemergten Rohdaten neu gebaut.
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            echo "Merge-Konflikt - generierte Dateien werden neu gebaut"
            git checkout --ours -- website/data/players.json website/data/marktwert_history.json 2>/dev/null || true
            git add website/data/players.json website/data/marktwert_history.json 2>/dev/null || true

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unerwarteter Konflikt ausserhalb der generierten Dateien:"
              git diff --name-only --diff-filter=U
              exit 1
            fi

            python scoring/build_player_overview.py
            python scoring/build_marktwert_history.py
            git add website/data
            git commit --no-edit
          fi

          git push

      - name: Webseite als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
